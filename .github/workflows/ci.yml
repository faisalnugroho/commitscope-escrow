name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # genlayer-test >= 1.x is a breaking rewrite; the suite is
          # written against the 0.29.x direct-mode API
          pip install "genlayer-test==0.29.2" pytest eth_utils
      - name: Pre-seed genvm artifact (pinned; upstream publishes genvm-runners-all, gltest expects genvm-universal)
        run: |
          mkdir -p ~/.cache/gltest-direct
          # Pin the exact genvm release the contract was validated
          # against. The contract header pins py-genlayer:1jb45... but
          # gltest resolves the STD LIB from the release tarball, and
          # newer releases dropped `allow_storage` from the top-level
          # export - version drift here breaks the whole suite.
          VER=v0.3.0-rc7
          curl -sL -o ~/.cache/gltest-direct/genvm-universal-$VER.tar.xz "https://github.com/genlayerlabs/genvm/releases/download/$VER/genvm-runners-all.tar.xz"
          ls -la ~/.cache/gltest-direct/
      - name: Run direct-mode test suite
        run: python -m pytest tests/direct/ -q --tb=short
