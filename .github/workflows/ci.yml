name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # genlayer-test >= 1.x is a breaking rewrite; the suite is
          # written against the 0.29.x direct-mode API
          pip install "genlayer-test==0.29.2" pytest eth_utils
      - name: Pre-seed genvm artifacts from vendored copies (pinned, deterministic)
        run: |
          # The upstream genlayerlabs/genvm release tag v0.3.0-rc7 was
          # re-published with DIFFERENT std-lib contents (std-lib hash
          # 10pqy... has no allow_storage; the original 11rhn... does).
          # Pin-by-tag is therefore unreliable - vendor the exact
          # extracted artifacts instead of downloading by tag.
          mkdir -p ~/.cache/gltest-direct/extracted/v0.3.0-rc7/py-genlayer/
          mkdir -p ~/.cache/gltest-direct/extracted/v0.3.0-rc7/py-lib-genlayer-std/
          cp -r vendor/genvm-artifacts/extracted/v0.3.0-rc7/py-genlayer/* ~/.cache/gltest-direct/extracted/v0.3.0-rc7/py-genlayer/
          cp -r vendor/genvm-artifacts/extracted/v0.3.0-rc7/py-lib-genlayer-std/* ~/.cache/gltest-direct/extracted/v0.3.0-rc7/py-lib-genlayer-std/
          ls -la ~/.cache/gltest-direct/extracted/v0.3.0-rc7/py-lib-genlayer-std/
      - name: Run direct-mode test suite
        run: python -m pytest tests/direct/ -s --tb=line
      - name: DEBUG cache contents (never blocks)
        if: always()
        run: |
          set +e
          ls -la ~/.cache/gltest-direct/extracted/
          ls -la ~/.cache/gltest-direct/extracted/*/ 2>/dev/null
          find ~/.cache/gltest-direct/extracted -maxdepth 3 -name "runner.json" -exec cat {} \;
